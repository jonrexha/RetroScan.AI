services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: retroscan
      MYSQL_USER: retroscan
      MYSQL_PASSWORD: retroscan
      MYSQL_ROOT_PASSWORD: retroscan-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uretroscan", "-pretroscan"]
      interval: 5s
      retries: 20

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__RetroScan: "Server=mysql;Port=3306;Database=retroscan;User ID=retroscan;Password=retroscan"
      Groq__ApiKey: ${GROQ_API_KEY:-}
    ports:
      - "${RETROSCAN_PORT:-8080}:8080"
    profiles: ["app"]

volumes:
  mysql-data:
